# Compose de PRODUCAO do Trilha — sobe a stack completa a partir das imagens
# publicadas no ghcr.io pelos CIs de cada servico.
#
# DORMENTE ate existir uma VPS: veja o README.md para o checklist de ativacao.
# As credenciais vem do arquivo .env (copie o .env.example e preencha).
#
# TOPOLOGIA DE REDE (defesa em profundidade):
#   - Rede 'internal': todos os servicos e a infra. Nenhum deles publica porta
#     no host, exceto o BFF e o broker MQTT. Postgres/Redis/MinIO e os servicos
#     cadastro/app/loc/midia so sao alcancaveis DENTRO desta rede — o mundo
#     externo nao chega neles direto, entao o rate limit do BFF nao e contornavel
#     batendo na porta do servico interno.
#   - Rede 'edge': fronteira publica. So o BFF (e, futuramente, um reverse proxy
#     Caddy/Traefik com TLS) vive aqui. Coloque o proxy nesta rede e deixe-o
#     enxergar APENAS o BFF; ele nao alcanca os servicos internos.
#
# O reverse proxy na frente do BFF e a primeira linha anti-DDoS (TLS + rate limit
# de borda). Quando ele existir, publique as portas por ele e defina no BFF
# SERVER_FORWARD_HEADERS_STRATEGY=framework para o rate limit chavear pelo IP real.

name: trilha

services:
  # ------------------------------------------------------------------ infra
  postgres:
    # PostGIS, nao o postgres puro: o servico 'loc' roda CREATE EXTENSION postgis
    # (V1) e cria indice GiST com ST_SetSRID/ST_MakePoint (V4). Numa imagem sem a
    # extensao o Flyway aborta e o loc nao sobe. Esta imagem e o Postgres oficial
    # + PostGIS, com o mesmo entrypoint e o mesmo docker-entrypoint-initdb.d.
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Cria trisha (Cadastro+APP) / trilha_localizacao / trilha_midia no 1o boot
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    networks: [internal]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  zeebe:
    # Orquestra o processo de cadastro (email de confirmacao + termos + timer
    # de limpeza). Sem ele o POST /usuario do Cadastro falha por design.
    # Versao alinhada ao spring-boot-starter-camunda:8.5.0 do Cadastro.
    image: camunda/zeebe:8.5.6
    restart: unless-stopped
    networks: [internal]
    environment:
      # Broker standalone, sem exporter — o historico vive so no proprio Zeebe.
      ZEEBE_BROKER_DATA_DISKUSAGECOMMANDWATERMARK: "0.998"
      ZEEBE_BROKER_DATA_DISKUSAGEREPLICATIONWATERMARK: "0.999"
    volumes:
      - zeebe-data:/usr/local/zeebe/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9600/ready > /dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    networks: [internal]
    ports:
      # Porta de infra exposta: devices publicam localizacao de fora.
      # Producao exige autenticacao (passwd + ACL — veja mosquitto/README).
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/etc/mosquitto/passwd:ro
      - ./mosquitto/acl:/etc/mosquitto/acl:ro
      - mosquitto-data:/var/lib/mosquitto

  # -------------------------------------------------------------- servicos
  # cadastro/app/loc/midia NAO publicam portas: so o BFF (e os proprios
  # servicos entre si) os alcanca, pela rede 'internal'.
  cadastro:
    image: ghcr.io/rafaeldossanto/trilha-cadastro:latest
    restart: unless-stopped
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      zeebe:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Banco COMPARTILHADO com o APP (ver postgres-init). O Cadastro e o dono da
      # tabela 'usuario'; o APP so a le.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/trisha
      ZEEBE_GATEWAY_ADDRESS: zeebe:26500
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DDL_AUTO: validate
      # Lockout de login por conta (contador de falhas com TTL).
      REDIS_HOST: redis
      JWT_ISSUER: ${JWT_ISSUER}
      JWT_RSA_PRIVATE_KEY_PATH: /keys/jwt-private.pem
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      EMAIL_CONFIRMACAO_URL: ${EMAIL_CONFIRMACAO_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
    volumes:
      # PEM PKCS#8 da chave RSA de assinatura dos JWTs (obrigatoria em prod:
      # sem ela o servico aborta o boot de proposito)
      - ./keys/jwt-private.pem:/keys/jwt-private.pem:ro

  app:
    image: ghcr.io/rafaeldossanto/trilha-app:latest
    restart: unless-stopped
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Mesmo banco do Cadastro: a entidade User do APP e uma view read-only da
      # tabela 'usuario'. Historico proprio do Flyway (flyway_schema_history_app).
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/trisha
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DDL_AUTO: validate
      JWKS_URI: http://cadastro:8080/oauth2/jwks

  loc:
    image: ghcr.io/rafaeldossanto/trilha-loc:latest
    restart: unless-stopped
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/trilha_localizacao
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DDL_AUTO: validate
      JWKS_URI: http://cadastro:8080/oauth2/jwks
      REDIS_HOST: redis
      MQTT_BROKER_URL: tcp://mosquitto:1883
      # O Mosquitto de prod exige auth (allow_anonymous false): as credenciais
      # do consumidor vem do .env e devem existir no passwd/acl do broker.
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      SERVICO_APP_URL: http://app:8081

  midia:
    image: ghcr.io/rafaeldossanto/trilha-midia:latest
    restart: unless-stopped
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/trilha_midia
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DDL_AUTO: validate
      JWKS_URI: http://cadastro:8080/oauth2/jwks
      # minio.url e fixo no application.yaml; o relaxed binding do Spring
      # permite sobrescrever pela env MINIO_URL
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      # Base PUBLICA usada para montar a URL do binario
      # (${MIDIA_PUBLIC_URL}/arquivo/{id}/conteudo). Precisa ser o dominio da API,
      # que o Caddy roteia para ca — o endereco interno do MinIO nao serve, e a
      # URL antiga (presigned) expirava em 7 dias e quebrava as fotos.
      MIDIA_PUBLIC_URL: https://${API_DOMAIN}
      # O front web sobe arquivo direto aqui (fora do BFF) — mesma origem do CORS.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

  bff:
    image: ghcr.io/rafaeldossanto/trilha-bff:latest
    restart: unless-stopped
    # Sem porta publicada: quem recebe o trafego externo e o Caddy, que faz TLS
    # e roteia para ca. O BFF segue alcancavel so pela rede interna.
    networks: [internal]
    depends_on:
      - cadastro
      - app
      - loc
      - midia
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWKS_URI: http://cadastro:8080/oauth2/jwks
      REDIS_HOST: redis
      SERVICO_CADASTRO_URL: http://cadastro:8080
      SERVICO_APP_URL: http://app:8081
      SERVICO_LOCALIZACAO_URL: http://loc:8082
      SERVICO_MIDIA_URL: http://midia:8083
      # 'framework' porque o BFF esta atras do Caddy: o rate limit precisa
      # chavear pelo IP real do cliente (X-Forwarded-For) e nao pelo IP do proxy.
      # So voltaria a ser 'none' se o BFF fosse exposto direto (ai o cliente
      # poderia forjar o header e escapar da trava).
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-framework}
      # Origem do front web (o browser bloqueia sem isso). Ex.: https://app.seudominio.com
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

  caddy:
    # Fronteira publica: TLS automatico (Let's Encrypt) e roteamento para os tres
    # servicos que o front precisa alcancar. Ver Caddyfile.
    image: caddy:2-alpine
    restart: unless-stopped
    networks: [edge, internal]
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados emitidos: sem persistir, cada restart pede certificado novo
      # e esbarra no rate limit do Let's Encrypt.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - bff
      - midia
      - loc

networks:
  # Fronteira publica: so o Caddy. Nao alcanca os internos por aqui.
  edge:
    driver: bridge
  # Malha interna: servicos + infra, sem porta publicada no host.
  internal:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
  mosquitto-data:
  zeebe-data:
  caddy-data:
  caddy-config:
