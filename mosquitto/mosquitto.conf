# Mosquitto 2.x — configuracao de PRODUCAO do Trilha.
# Diferente do dev (loc/mosquitto/mosquitto.conf), aqui anonimo e proibido:
# o broker fica exposto na internet para os devices publicarem localizacao.

listener 1883
allow_anonymous false

# Gerar na VPS: mosquitto_passwd -c ./mosquitto/passwd loc-consumer
password_file /etc/mosquitto/passwd

# Baseie-se no acl.example ao lado (loc-consumer le tudo; cada device so
# publica no topico do proprio usuario)
acl_file /etc/mosquitto/acl

persistence true
persistence_location /var/lib/mosquitto/

max_inflight_messages 10
max_queued_messages 100

log_type error
log_type warning
log_type notice
log_timestamp true
