# Mosquitto 2.x — configuracao de DEV do compose local (docker-compose.dev.yml).
# Anonimo liberado de proposito: broker so escuta no localhost da maquina do
# desenvolvedor. A configuracao de producao (mosquitto.conf ao lado) exige auth.

listener 1883
allow_anonymous true

log_type error
log_type warning
log_type notice
log_timestamp true
